<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Local CM6 Scratchpad</title>
	</head>
	<body>
		<div id="toolbar">
			<strong>Scratchpad</strong>

			<span class="hint">Left = old/local, Right = new/suggested</span>

			<button id="toggle-theme" type="button">Dark mode</button>
			<button id="swap" type="button">Swap</button>
			<button id="copy-left" type="button">Copy left</button>
			<button id="copy-right" type="button">Copy right</button>
			<button id="clear" type="button">Clear</button>

			<span id="status">Ready</span>
		</div>

		<div id="editor"></div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
